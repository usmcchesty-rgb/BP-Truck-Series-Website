<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header class="nav"><div class="brand">BP ADMIN <span>SETTINGS</span></div><nav><a href="/">Site</a></nav></header><main class="wrap"><h1>Admin</h1><p class="sub">Password is checked by the server. Settings and driver profiles save to Supabase after you add Supabase keys in Vercel.</p><div class="panel"><h2>Site Settings / Scrape Links</h2><input id="pw" class="input" type="password" placeholder="Admin password"><input id="seriesName" class="input" placeholder="Series name"><input id="seasonName" class="input" placeholder="Season name"><input id="standingsUrl" class="input" placeholder="Standings URL"><input id="scheduleUrl" class="input" placeholder="Schedule URL"><input id="playoffCut" class="input" type="number" placeholder="Playoff cut"><button class="btn" onclick="saveSettings()">Save Settings</button><pre id="adminMsg"></pre></div><div class="panel"><h2>Driver Profile</h2><input id="driver_name" class="input" placeholder="Driver name exactly as standings shows"><input id="truck_number" class="input" placeholder="Truck number"><input id="iracing_id" class="input" placeholder="iRacing / SimRacerHub ID"><input id="manufacturer" class="input" placeholder="Manufacturer"><input id="team" class="input" placeholder="Team"><input id="photo_url" class="input" placeholder="Photo URL or /assets/drivers/name.png"><button class="btn" onclick="saveDriver()">Save Driver</button></div></main><script src="/app.js"></script></body></html>
