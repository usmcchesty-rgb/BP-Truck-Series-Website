<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Analytics — BP Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/admin-layout.css">
  <link rel="stylesheet" href="/admin/admin-group-shell.css">
  <style>
    .sub { color: var(--bp-text-secondary); font-size: 12px; margin-bottom: 16px; line-height: 1.45; }
    .pw-row { max-width: 320px; margin-bottom: 14px; }
    .input, .select { width: 100%; padding: 8px; background: #090909; color: #fff; border: 1px solid #555; border-radius: 4px; font-size: 12px; }
    .input--inline { width: auto; min-width: 140px; }
    #loginMsg, #analyticsMsg { margin-top: 10px; font-size: 12px; color: #ccc; white-space: pre-wrap; }
    #loginMsg.error, #analyticsMsg.error { color: #ff6060; }
    .analytics-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 0 0 16px;
      padding: 12px 14px;
      border: 1px solid #333;
      background: rgba(0,0,0,.25);
    }
    .analytics-filter-btn {
      padding: 7px 12px;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #bbb;
      background: linear-gradient(#1c1c1c, #080808);
      border: 1px solid #444;
      cursor: pointer;
    }
    .analytics-filter-btn.is-active {
      color: #fff;
      background: linear-gradient(#d40000, #680000);
      border-color: #ff2424;
    }
    .analytics-custom-range {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .analytics-custom-range label {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      color: #888;
    }
    .analytics-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .analytics-card {
      border: 1px solid #333;
      background: rgba(0,0,0,.25);
      padding: 12px 14px;
    }
    .analytics-card dt {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      font-weight: 900;
      margin: 0 0 4px;
    }
    .analytics-card dd {
      margin: 0;
      font-size: 20px;
      color: #eee;
      font-weight: 900;
      line-height: 1.2;
    }
    .analytics-card dd small {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 400;
      color: #aaa;
    }
    .analytics-panel { display: none; }
    .analytics-panel.is-active { display: block; }
    .analytics-table-wrap { overflow-x: auto; border: 1px solid #333; }
    .analytics-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .analytics-table th, .analytics-table td {
      padding: 8px 10px;
      border-bottom: 1px solid #222;
      text-align: left;
      vertical-align: top;
    }
    .analytics-table th {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #999;
      background: #111;
      position: sticky;
      top: 0;
    }
    .analytics-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .analytics-breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .analytics-breakdown-panel {
      border: 1px solid #333;
      background: rgba(0,0,0,.25);
      padding: 12px 14px;
    }
    .analytics-breakdown-panel h3 {
      margin: 0 0 10px;
      font-size: 13px;
      color: #ff3030;
      text-transform: uppercase;
    }
    .analytics-bar-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
      font-size: 11px;
    }
    .analytics-bar-track {
      height: 8px;
      background: #1a1a1a;
      border: 1px solid #333;
      overflow: hidden;
    }
    .analytics-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #a00000, #e50914);
    }
    .analytics-chart-bars {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      min-height: 180px;
      padding: 12px 0 0;
      overflow-x: auto;
    }
    .analytics-chart-col {
      flex: 1 0 28px;
      max-width: 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .analytics-chart-bar {
      width: 100%;
      min-height: 4px;
      background: linear-gradient(180deg, #ff3030, #680000);
      border: 1px solid #733;
    }
    .analytics-chart-label {
      font-size: 9px;
      color: #888;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      max-height: 64px;
      overflow: hidden;
    }
    .analytics-empty {
      padding: 24px;
      text-align: center;
      color: #888;
      font-size: 12px;
      border: 1px dashed #444;
    }
  </style>
</head>
<body class="admin-group-page">
  <div id="admin-nav-root"></div>
  <script src="/admin/admin-nav.js"></script>

  <main id="loginView" class="wrap" hidden>
    <h1>Analytics</h1>
    <p class="sub">Enter the admin password to view site traffic analytics.</p>
    <div class="pw-row">
      <input id="loginPw" class="input" type="password" placeholder="Admin password" autocomplete="current-password">
      <button class="btn" type="button" onclick="login()">Unlock</button>
      <pre id="loginMsg"></pre>
    </div>
  </main>

  <main id="adminView" class="wrap admin-group-content" hidden>
    <div class="admin-group-header">
      <h1>Analytics</h1>
      <p class="sub">Anonymous public site traffic. Admin pages are excluded from tracking.</p>
    </div>

    <nav id="analyticsTabBar" class="admin-group-tabs" aria-label="Analytics sections">
      <button type="button" class="admin-group-tab is-active" data-tab="overview">Overview</button>
      <button type="button" class="admin-group-tab" data-tab="pages">Pages</button>
      <button type="button" class="admin-group-tab" data-tab="referrers">Referrers</button>
      <button type="button" class="admin-group-tab" data-tab="devices">Devices</button>
      <button type="button" class="admin-group-tab" data-tab="daily">Daily Traffic</button>
    </nav>

    <div id="groupMissionSummary"></div>

    <div class="analytics-filters">
      <button type="button" class="analytics-filter-btn" data-preset="today">Today</button>
      <button type="button" class="analytics-filter-btn" data-preset="last7">Last 7 Days</button>
      <button type="button" class="analytics-filter-btn is-active" data-preset="last30">Last 30 Days</button>
      <button type="button" class="analytics-filter-btn" data-preset="season">Season to Date</button>
      <button type="button" class="analytics-filter-btn" data-preset="custom">Custom</button>
      <div id="customRange" class="analytics-custom-range" hidden>
        <label for="startDate">From</label>
        <input id="startDate" class="input input--inline" type="date">
        <label for="endDate">To</label>
        <input id="endDate" class="input input--inline" type="date">
        <button id="applyCustomRange" class="btn btn-secondary" type="button">Apply</button>
      </div>
      <button id="refreshAnalytics" class="btn btn-secondary" type="button" style="margin-left:auto;">Refresh</button>
    </div>

    <div id="panelOverview" class="analytics-panel is-active">
      <div id="overviewCards" class="analytics-summary-grid"></div>
    </div>
    <div id="panelPages" class="analytics-panel">
      <div id="pagesTable" class="analytics-table-wrap"></div>
    </div>
    <div id="panelReferrers" class="analytics-panel">
      <div id="referrersTable" class="analytics-table-wrap"></div>
    </div>
    <div id="panelDevices" class="analytics-panel">
      <div id="devicesBreakdown" class="analytics-breakdown-grid"></div>
    </div>
    <div id="panelDaily" class="analytics-panel">
      <div id="dailyChart" class="analytics-chart-bars"></div>
      <div id="dailyTable" class="analytics-table-wrap" style="margin-top:14px;"></div>
    </div>

    <pre id="analyticsMsg"></pre>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const SESSION_KEY = 'bp_admin_pw';
    let activeTab = 'overview';
    let activePreset = 'last30';

    function getSessionPw() {
      return sessionStorage.getItem(SESSION_KEY) || '';
    }

    async function verifyPassword(pw) {
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw, verifyOnly: true }),
      });
      return res.ok;
    }

    function showLogin() {
      $('#loginView').hidden = false;
      $('#adminView').hidden = true;
      if (window.AdminNav) AdminNav.setLoggedIn(false);
    }

    async function initAnalyticsMissionSummary() {
      const mount = $('#groupMissionSummary');
      if (!mount) return;
      const boot = () => {
        if (!window.AdminMissionTaskSummary) return;
        AdminMissionTaskSummary.init({ section: 'analytics', mount });
      };
      if (window.AdminMissionTaskSummary) boot();
      else document.getElementById('admin-mission-summary-script')?.addEventListener('load', boot, { once: true });
    }

    async function showAdmin() {
      $('#loginView').hidden = true;
      $('#adminView').hidden = false;
      if (window.AdminNav) AdminNav.setLoggedIn(true);
      initAnalyticsMissionSummary();
      applyTabFromHash();
      await refreshAll();
    }

    async function login() {
      const msg = $('#loginMsg');
      const pw = $('#loginPw').value;
      if (!pw) { msg.textContent = 'Enter the admin password.'; msg.classList.add('error'); return; }
      msg.textContent = 'Checking...';
      msg.classList.remove('error');
      try {
        if (!(await verifyPassword(pw))) throw new Error('Bad password');
        sessionStorage.setItem(SESSION_KEY, pw);
        $('#loginPw').value = '';
        msg.textContent = '';
        showAdmin();
      } catch (e) {
        msg.textContent = e.message;
        msg.classList.add('error');
      }
    }

    async function initSession() {
      const pw = getSessionPw();
      if (!pw) return showLogin();
      try {
        if (await verifyPassword(pw)) return showAdmin();
      } catch {}
      sessionStorage.removeItem(SESSION_KEY);
      showLogin();
    }

    function setMsg(text, isError) {
      const msg = $('#analyticsMsg');
      msg.textContent = text || '';
      msg.classList.toggle('error', !!isError);
    }

    function filterPayload() {
      const payload = { password: getSessionPw(), preset: activePreset };
      if (activePreset === 'custom') {
        payload.startDate = $('#startDate').value;
        payload.endDate = $('#endDate').value;
      }
      return payload;
    }

    async function apiCall(action) {
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, ...filterPayload() }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatNumber(n) {
      return Number(n || 0).toLocaleString();
    }

    function formatDateTime(value) {
      if (!value) return '—';
      const d = new Date(value);
      return Number.isNaN(d.getTime()) ? value : d.toLocaleString();
    }

    function renderOverview(data) {
      const topPage = data.topPage ? `${data.topPage.key} (${formatNumber(data.topPage.views)} views)` : '—';
      const topRef = data.topReferrer ? `${data.topReferrer.key} (${formatNumber(data.topReferrer.views)} views)` : '—';
      const topDay = data.mostActiveDay ? `${data.mostActiveDay.date} (${formatNumber(data.mostActiveDay.views)} views)` : '—';
      $('#overviewCards').innerHTML = `
        <div class="analytics-card"><dt>Total Page Views</dt><dd>${formatNumber(data.totalPageViews)}</dd></div>
        <div class="analytics-card"><dt>Unique Visitors</dt><dd>${formatNumber(data.uniqueVisitors)}</dd></div>
        <div class="analytics-card"><dt>Views Today</dt><dd>${formatNumber(data.viewsToday)}</dd></div>
        <div class="analytics-card"><dt>Views Last 7 Days</dt><dd>${formatNumber(data.viewsLast7Days)}</dd></div>
        <div class="analytics-card"><dt>Views Last 30 Days</dt><dd>${formatNumber(data.viewsLast30Days)}</dd></div>
        <div class="analytics-card"><dt>Top Page</dt><dd><small>${escapeHtml(topPage)}</small></dd></div>
        <div class="analytics-card"><dt>Top Referrer</dt><dd><small>${escapeHtml(topRef)}</small></dd></div>
        <div class="analytics-card"><dt>Most Active Day</dt><dd><small>${escapeHtml(topDay)}</small></dd></div>
      `;
    }

    function renderPagesTable(data) {
      const rows = data.pages || [];
      if (!rows.length) {
        $('#pagesTable').innerHTML = '<div class="analytics-empty">No page views in this range yet.</div>';
        return;
      }
      $('#pagesTable').innerHTML = `
        <table class="analytics-table">
          <thead><tr>
            <th>Page</th><th>Views</th><th>Unique Visitors</th><th>Avg / Visitor</th><th>Last Viewed</th><th>% Total</th>
          </tr></thead>
          <tbody>${rows.map((r) => `
            <tr>
              <td>${escapeHtml(r.path)}</td>
              <td class="num">${formatNumber(r.views)}</td>
              <td class="num">${formatNumber(r.uniqueVisitors)}</td>
              <td class="num">${r.avgViewsPerVisitor}</td>
              <td>${formatDateTime(r.lastViewed)}</td>
              <td class="num">${r.percentOfTotal}%</td>
            </tr>`).join('')}</tbody>
        </table>`;
    }

    function renderReferrersTable(data) {
      const rows = data.referrers || [];
      if (!rows.length) {
        $('#referrersTable').innerHTML = '<div class="analytics-empty">No referrer data in this range yet.</div>';
        return;
      }
      $('#referrersTable').innerHTML = `
        <table class="analytics-table">
          <thead><tr><th>Referrer</th><th>Views</th><th>Unique Visitors</th><th>% Traffic</th></tr></thead>
          <tbody>${rows.map((r) => `
            <tr>
              <td>${escapeHtml(r.referrer)}</td>
              <td class="num">${formatNumber(r.views)}</td>
              <td class="num">${formatNumber(r.uniqueVisitors)}</td>
              <td class="num">${r.percentOfTraffic}%</td>
            </tr>`).join('')}</tbody>
        </table>`;
    }

    function renderBreakdownList(title, rows) {
      const max = Math.max(...rows.map((r) => r.views), 1);
      const bars = rows.map((r) => `
        <div class="analytics-bar-row">
          <div>
            <div>${escapeHtml(r.label)}</div>
            <div class="analytics-bar-track"><div class="analytics-bar-fill" style="width:${Math.round((r.views / max) * 100)}%"></div></div>
          </div>
          <div>${formatNumber(r.views)} · ${r.percentOfTraffic}%</div>
        </div>`).join('');
      return `<div class="analytics-breakdown-panel"><h3>${escapeHtml(title)}</h3>${bars || '<div class="analytics-empty">No data</div>'}</div>`;
    }

    function renderDevices(data) {
      if (!data.totalViews) {
        $('#devicesBreakdown').innerHTML = '<div class="analytics-empty">No device data in this range yet.</div>';
        return;
      }
      $('#devicesBreakdown').innerHTML =
        renderBreakdownList('Device Type', data.devices || []) +
        renderBreakdownList('Browser', data.browsers || []) +
        renderBreakdownList('Operating System', data.operatingSystems || []);
    }

    function renderDaily(data) {
      const rows = data.daily || [];
      if (!rows.length) {
        $('#dailyChart').innerHTML = '';
        $('#dailyTable').innerHTML = '<div class="analytics-empty">No daily traffic in this range yet.</div>';
        return;
      }
      const max = Math.max(...rows.map((r) => r.views), 1);
      $('#dailyChart').innerHTML = rows.map((r) => `
        <div class="analytics-chart-col" title="${escapeHtml(r.date)}: ${formatNumber(r.views)} views">
          <div class="analytics-chart-bar" style="height:${Math.max(8, Math.round((r.views / max) * 140))}px"></div>
          <div class="analytics-chart-label">${escapeHtml(r.date.slice(5))}</div>
        </div>`).join('');
      $('#dailyTable').innerHTML = `
        <table class="analytics-table">
          <thead><tr><th>Date</th><th>Views</th><th>Unique Visitors</th></tr></thead>
          <tbody>${rows.map((r) => `
            <tr>
              <td>${escapeHtml(r.date)}</td>
              <td class="num">${formatNumber(r.views)}</td>
              <td class="num">${formatNumber(r.uniqueVisitors)}</td>
            </tr>`).join('')}</tbody>
        </table>`;
    }

    async function refreshAll() {
      setMsg('Loading analytics...');
      try {
        const [overview, pages, referrers, devices, daily] = await Promise.all([
          apiCall('getAnalyticsOverview'),
          apiCall('getAnalyticsPages'),
          apiCall('getAnalyticsReferrers'),
          apiCall('getAnalyticsDevices'),
          apiCall('getAnalyticsDailyTraffic'),
        ]);
        renderOverview(overview);
        renderPagesTable(pages);
        renderReferrersTable(referrers);
        renderDevices(devices);
        renderDaily(daily);
        setMsg('');
      } catch (e) {
        setMsg(e.message || 'Failed to load analytics.', true);
      }
    }

    function switchTab(tabId) {
      activeTab = tabId;
      document.querySelectorAll('#analyticsTabBar [data-tab]').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.tab === tabId);
      });
      document.querySelectorAll('.analytics-panel').forEach((panel) => {
        panel.classList.toggle('is-active', panel.id === `panel${tabId.charAt(0).toUpperCase()}${tabId.slice(1)}`);
      });
      const hash = tabId === 'overview' ? '#overview' : `#${tabId}`;
      if (location.hash !== hash) history.replaceState(null, '', `${location.pathname}${hash}`);
    }

    function applyTabFromHash() {
      const tab = String(location.hash || '#overview').replace('#', '') || 'overview';
      const allowed = ['overview', 'pages', 'referrers', 'devices', 'daily'];
      switchTab(allowed.includes(tab) ? tab : 'overview');
    }

    document.querySelectorAll('#analyticsTabBar [data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    document.querySelectorAll('.analytics-filter-btn[data-preset]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        activePreset = btn.dataset.preset;
        document.querySelectorAll('.analytics-filter-btn[data-preset]').forEach((b) => {
          b.classList.toggle('is-active', b === btn);
        });
        $('#customRange').hidden = activePreset !== 'custom';
        if (activePreset !== 'custom') await refreshAll();
      });
    });

    $('#applyCustomRange')?.addEventListener('click', refreshAll);
    $('#refreshAnalytics')?.addEventListener('click', refreshAll);
    window.addEventListener('hashchange', applyTabFromHash);
    $('#loginPw')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

    const today = new Date();
    const prior = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);
    $('#endDate').value = today.toISOString().slice(0, 10);
    $('#startDate').value = prior.toISOString().slice(0, 10);

    initSession();
  </script>
</body>
</html>
