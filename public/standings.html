<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blazing Pedals Truck Series Standings</title>
    <meta name="description" content="Season 11 championship standings for the Blazing Pedals Truck Series." />
    <meta property="og:site_name" content="Blazing Pedals Truck Series" />
    <meta property="og:title" content="Blazing Pedals Truck Series Standings" />
    <meta property="og:description" content="Season 11 championship standings for the Blazing Pedals Truck Series." />
    <meta property="og:image" content="/assets/logos/New Clean Logo.png" />
    <meta property="og:url" content="/standings.html" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blazing Pedals Truck Series Standings" />
    <meta name="twitter:description" content="Season 11 championship standings for the Blazing Pedals Truck Series." />
    <meta name="twitter:image" content="/assets/logos/New Clean Logo.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="/share.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <header class="topbar"></header>

    <main>
      <section id="overview">
        <div class="overview-layout">
          <div class="main-col">
            <div class="standings-page-toolbar">
              <div id="standingsShareHost"></div>
            </div>
            <section id="podium" class="podium"></section>
            <section class="panel wide">
              <div class="standings-table-tabs" role="tablist" aria-label="Standings table view">
                <button type="button" class="active" data-table-view="top16" role="tab" aria-selected="true">TOP 16</button>
                <button type="button" id="fullStandingsTab" data-table-view="full" role="tab" aria-selected="false">FULL STANDINGS (1–43)</button>
              </div>
              <input id="search" type="search" placeholder="Search driver..." hidden />
              <div class="table-wrap">
                <table>
                  <thead id="overviewHead"></thead>
                  <tbody id="overviewBody"></tbody>
                </table>
              </div>
            </section>
          </div>
          <aside class="sidebar">
            <div class="card stat">
              <h3 id="sidebarSeason">SEASON 11</h3>
              <div class="stat-row">
                <span class="stat-icon" aria-hidden="true">🏁</span>
                <div>
                  <b id="raceCount">0 / 20</b>
                  <span>RACES COMPLETED</span>
                </div>
              </div>
              <div class="stat-row">
                <span class="stat-icon" aria-hidden="true">🏆</span>
                <div>
                  <b id="winnerCount">0</b>
                  <span>DIFFERENT WINNERS</span>
                </div>
              </div>
              <div class="stat-row">
                <span class="stat-icon" aria-hidden="true">📊</span>
                <div>
                  <b id="avgCautions">N/A</b>
                  <span title="Caution data unavailable">AVG CAUTIONS PER RACE</span>
                </div>
              </div>
            </div>
            <div class="card last-winner-card" id="lastWinnerCard">
              <h3>LAST WINNER</h3>
              <div class="last-winner">
                <img
                  id="lastWinnerImg"
                  src="/assets/drivers/placeholder.png"
                  alt=""
                />
                <div>
                  <b id="lastWinnerName">—</b>
                  <span id="lastWinnerTrack">Track TBD</span>
                  <span id="lastWinnerDate">Date TBD</span>
                </div>
              </div>
            </div>
            <div class="card next-race-card">
              <h3>NEXT RACE</h3>
              <div class="next-race-row">
                <div class="next-race-media">
                  <img id="nextRaceImg" alt="" hidden />
                  <div
                    class="next-race-placeholder"
                    id="nextRacePlaceholder"
                    aria-hidden="true"
                  >
                    🏁
                  </div>
                </div>
                <div class="next-race-info">
                  <div class="track" id="nextRaceTrack">TBD</div>
                </div>
              </div>
              <p class="next-race-copy" id="nextRaceDate">Date TBD</p>
              <p class="next-race-time" id="nextRaceTime"></p>
              <button type="button" onclick="location.href = 'schedule.html'">
                VIEW SCHEDULE
              </button>
            </div>
            <div class="card logo-card">
              <div class="bottom-bp">BP</div>
              <b>BLAZING <span>PEDALS</span></b>
              <small>SIM RACING LEAGUE</small>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer>FAST DRIVERS. CLOSE RACING. <span>BIG FUN.</span></footer>
    <script src="public-nav.js"></script>
    <script>
      BPPublicNav.init({
        active: "standings",
        title: "STANDINGS",
        subtitle: "SEASON 11",
        subtitleId: "seasonLabel",
        right: "refresh",
      });
    </script>
    <script src="/season-summary.js"></script>
    <script src="/share-meta.js"></script>
    <script src="/share.js"></script>
    <script src="app.js"></script>
  </body>
</html>
