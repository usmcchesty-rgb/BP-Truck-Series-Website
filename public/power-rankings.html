<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blazing Pedals Truck Series — Power Rankings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <header class="topbar"></header>

    <main>
      <section class="panel full-panel power-rankings-page">
        <h2>POWER RANKINGS</h2>
        <p class="page-intro" id="prIntro">
          Weekly power rankings based on recent form, consistency, and race performance.
        </p>

        <div class="power-rankings-layout">
          <div class="power-rankings-main">
            <div class="power-rankings-header" id="prHeader" hidden>
              <div>
                <h3 id="prWeekTitle">Race Rankings</h3>
                <p class="power-rankings-date" id="prPublishedDate"></p>
              </div>
            </div>

            <div id="prEmpty" class="placeholder-panel" hidden>
              <p>No power rankings have been published yet. Check back after the next race.</p>
            </div>

            <div id="prList" class="power-rankings-list"></div>

            <section id="prHonorableSection" class="power-rankings-honorable" hidden>
              <h3>HONORABLE MENTIONS</h3>
              <div id="prHonorableList" class="power-rankings-honorable-list"></div>
            </section>
          </div>

          <aside class="power-rankings-sidebar panel" id="prArchivePanel" hidden>
            <h3>PREVIOUS RANKINGS</h3>
            <nav id="prArchiveNav" class="power-rankings-archive-nav" aria-label="Previous rankings"></nav>
          </aside>
        </div>
      </section>
    </main>

    <footer>FAST DRIVERS. CLOSE RACING. <span>BIG FUN.</span></footer>

    <script src="/public-nav.js"></script>
    <script>
      BPPublicNav.init({
        active: "power-rankings",
        title: "POWER RANKINGS",
        subtitle: "SEASON 11",
        right: "tagline",
      });
    </script>
    <script src="/power-rankings.js"></script>
  </body>
</html>
