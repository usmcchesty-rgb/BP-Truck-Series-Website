<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blazing Pedals Truck Series — Drivers</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <header class="topbar"></header>

    <main>
      <section class="panel full-panel">
        <h2>DRIVER PROFILES</h2>
        <p class="page-intro">
          Meet the drivers competing in the Blazing Pedals Truck Series. Profiles include car numbers and photos where available.
        </p>
        <div class="drivers-toolbar" id="driversToolbar">
          <label class="drivers-sort-control" for="driversSortSelect">
            <span class="drivers-sort-label">Sort Drivers</span>
            <select id="driversSortSelect" class="drivers-sort-select" aria-label="Sort drivers">
              <option value="active-first" selected>Active First</option>
              <option value="name-az">Name A–Z</option>
              <option value="name-za">Name Z–A</option>
              <option value="car-asc">Car Number Low–High</option>
              <option value="car-desc">Car Number High–Low</option>
              <option value="inactive-first">Inactive First</option>
            </select>
          </label>
        </div>
        <div id="driversGrid" class="driver-grid"></div>
      </section>
    </main>

    <footer>FAST DRIVERS. CLOSE RACING. <span>BIG FUN.</span></footer>

    <script src="/public-nav.js"></script>
    <script>
      BPPublicNav.init({
        active: "drivers",
        title: "DRIVERS",
        subtitle: "SEASON 11",
        right: "tagline",
      });
    </script>
    <script src="/drivers.js"></script>
  </body>
</html>
